function aggiornaPrezzi(colonna) {

  const listino = document.getElementById(`input-listino${colonna}`).value;
  const upgrade = document.getElementById(`input-upgrade${colonna}`).value;

  const listinoBox = document.getElementById(`listino-box${colonna}`);
  const prezzoBox = document.getElementById(`prezzo-box${colonna}`);

  if (!listino || !upgrade) {
    listinoBox.style.display = "none";
    prezzoBox.style.display = "none";
    return;
  }

  document.getElementById(`listino${colonna}`).innerText = listino;
  document.getElementById(`prezzo-upgrade${colonna}`).innerText = upgrade;

  document.getElementById(`listino${colonna}`).style.fontWeight = "bold";
  document.getElementById(`prezzo-upgrade${colonna}`).style.fontWeight = "bold";

  listinoBox.style.display = "block";
  prezzoBox.style.display = "block";

  prezziConfermati[colonna] = true;

  document.getElementById(`admin-panel${colonna}`).style.display = "none";
}

// Popola menu
const s1 = document.getElementById("auto1");
const s2 = document.getElementById("auto2");


// Popola suggerimenti
for (let nome in auto) {
  lista1.innerHTML += `<option value="${nome}">`;
  lista2.innerHTML += `<option value="${nome}">`;
}

// Valori iniziali
s1.value = sessionStorage.getItem("auto1") || "Seleziona Auto";
s2.value = sessionStorage.getItem("auto2") || "Seleziona Auto";




function pulisciSeVuoto(el){
  el.value = "";
}








function renderLista(id){

  const box = document.getElementById(id);
  box.innerHTML = "";

  for (let nome in auto){

    let div = document.createElement("div");
    div.innerText = nome;

    div.onclick = function(){

      if(id === "list1"){

        document.getElementById("auto1").value = nome;
        sessionStorage.setItem("auto1", nome);

      } else {

        document.getElementById("auto2").value = nome;
        sessionStorage.setItem("auto2", nome);

      }

      box.style.display = "none";
      aggiorna();
    };

    box.appendChild(div);
  }
}


function filtra(inputId, listId){
  const valore = document.getElementById(inputId).value.toLowerCase();
  const box = document.getElementById(listId);

  box.innerHTML = "";

  for (let nome in auto){
    if(nome.toLowerCase().includes(valore)){
      let div = document.createElement("div");
      div.innerText = nome;

      div.onclick = function(){
        document.getElementById(inputId).value = nome;
        box.style.display = "none";
        aggiorna();
      };

      box.appendChild(div);
    }
  }

  box.style.display = "block";
}



function toggleLista(id){
  const box = document.getElementById(id);
  box.style.display = box.style.display === "block" ? "none" : "block";
  if(box.style.display === "block") renderLista(id);
}







function aggiorna() {

  const a = auto[s1.value] || auto[""];
  const b = auto[s2.value] || auto[""];

  const datiA = a[lingua] || a;
  const datiB = b[lingua] || b;

  // =====================
  // CARD 1
  // =====================
  document.getElementById("nome1").innerText =
    s1.value && s1.value !== "Seleziona Auto" ? s1.value : "Seleziona Auto";

  document.getElementById("c1a").innerText = datiA.c1;
  document.getElementById("c2a").innerText = datiA.c2;
  document.getElementById("c3a").innerText = datiA.c3;
  document.getElementById("c4a").innerText = datiA.c4;

  document.getElementById("v1a").innerText = datiA.v1;
  document.getElementById("v2a").innerText = datiA.v2;
  document.getElementById("v3a").innerText = datiA.v3;
  document.getElementById("v4a").innerText = datiA.v4;

  const logo1 = document.getElementById("logo1");
  const img1 = document.getElementById("img1");

  if (s1.value === "Seleziona Auto" || !auto[s1.value]) {
    logo1.style.display = "block";
    img1.style.display = "none";
  } else {
    logo1.style.display = "none";
    img1.src = a.img;
    img1.style.display = "block";
  }

  // =====================
  // CARD 2
  // =====================
  document.getElementById("nome2").innerText =
    s2.value && s2.value !== "Seleziona Auto" ? s2.value : "Seleziona Auto";

  document.getElementById("c1b").innerText = datiB.c1;
  document.getElementById("c2b").innerText = datiB.c2;
  document.getElementById("c3b").innerText = datiB.c3;
  document.getElementById("c4b").innerText = datiB.c4;

  document.getElementById("v1b").innerText = datiB.v1;
  document.getElementById("v2b").innerText = datiB.v2;
  document.getElementById("v3b").innerText = datiB.v3;
  document.getElementById("v4b").innerText = datiB.v4;

  const logo2 = document.getElementById("logo2");
  const img2 = document.getElementById("img2");

  if (s2.value === "Seleziona Auto" || !auto[s2.value]) {
    logo2.style.display = "block";
    img2.style.display = "none";
  } else {
    logo2.style.display = "none";
    img2.src = b.img;
    img2.style.display = "block";
  }

  // =====================
  // PREZZI + ADMIN PANEL (FIX DEFINITIVO)
  // =====================

  gestisciPannelloPrezzi(1, s1.value, ultimaAuto1);
  gestisciPannelloPrezzi(2, s2.value, ultimaAuto2);

  ultimaAuto1 = s1.value;
  ultimaAuto2 = s2.value;
}

function gestisciPannelloPrezzi(colonna, autoSelezionata, ultimaAuto) {
  if (autoSelezionata === ultimaAuto) return;

  document.getElementById(`input-listino${colonna}`).value = "";
  document.getElementById(`input-upgrade${colonna}`).value = "";
  document.getElementById(`listino${colonna}`).innerText = "";
  document.getElementById(`prezzo-upgrade${colonna}`).innerText = "";
  document.getElementById(`listino-box${colonna}`).style.display = "none";
  document.getElementById(`prezzo-box${colonna}`).style.display = "none";

  prezziConfermati[colonna] = false;

  const autoValida = autoSelezionata &&
    autoSelezionata !== "Seleziona Auto" && auto[autoSelezionata];

  document.getElementById(`admin-panel${colonna}`).style.display =
    autoValida ? "block" : "none";
}





function nascondiExtra(colonna){

  const listinoBox = document.getElementById(`listino-box${colonna}`);
  const prezzoBox = document.getElementById(`prezzo-box${colonna}`);
  const adminPanel = document.getElementById(`admin-panel${colonna}`);

  // nasconde prezzi visualizzati
  listinoBox.style.display = "none";
  prezzoBox.style.display = "none";

  // nasconde modulo inserimento + tasti OK e Pulisci
  adminPanel.style.display = "none";

}



function cambiaLingua(lang){

  lingua = lang;

  aggiorna();
}
      

</script>
